name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        
      - name: Check JavaScript syntax - Core files
        run: |
          echo "Checking core files..."
          node --check index.js
          node --check renderer.js
          node --check preload.js
          node --check store.js
          echo "Core files OK"
          
      - name: Check JavaScript syntax - Services
        run: |
          echo "Checking services..."
          for f in services/*.js; do
            echo "  Checking $f"
            node --check "$f"
          done
          echo "Services OK"
          
      - name: Check JavaScript syntax - MCP Servers
        run: |
          echo "Checking MCP servers..."
          for f in mcp-servers/*/index.js; do
            echo "  Checking $f"
            node --check "$f"
          done
          echo "MCP servers OK"
          
      - name: Validate package.json
        run: |
          node -e "const pkg = require('./package.json'); console.log('Package:', pkg.name, 'v' + pkg.version);"
          
      - name: Validate JSON files
        run: |
          echo "Checking JSON files..."
          for f in config/*.json data/*.json; do
            if [ -f "$f" ]; then
              echo "  Checking $f"
              node -e "require('./$f')"
            fi
          done
          echo "JSON files OK"

  build-test:
    runs-on: windows-latest
    needs: lint-and-validate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        
      - name: Test build (pack only - no installer)
        run: npm run pack
        continue-on-error: true
        
      - name: Verify build output
        run: |
          Write-Host "Build test completed"
          if (Test-Path "dist/") {
            Write-Host "dist/ directory exists"
            Get-ChildItem dist/ -Recurse | Select-Object -First 20 | ForEach-Object { Write-Host "  $($_.FullName)" }
          } else {
            Write-Host "Note: dist/ directory not created (expected for pack-only test)"
          }
        shell: pwsh

  mcp-servers-test:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install and validate MCP servers
        run: |
          for server in mcp-servers/*/; do
            if [ -f "${server}package.json" ]; then
              echo "Installing $server..."
              cd "$server"
              npm install
              echo "Validating $server..."
              node --check index.js
              cd ../..
            fi
          done
          echo "All MCP servers validated"
